<!doctype html><html lang="en-NZ"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Quote check · Crewcut Lawn &amp; Garden</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2056%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20fill%3D%22none%22%20stroke%3D%22%231f4d2b%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M5%2025%2032%205l27%2020%22/%3E%3Cpath%20d%3D%22M14%2030v20h36V22%22/%3E%3Cpath%20d%3D%22M14%2022v3%22/%3E%3Cpath%20d%3D%22M23%2047c-6-7-5-15%203-18%204%207%202%2014-3%2018z%22/%3E%3Cpath%20d%3D%22M29%2046c0-9%205-14%2014-15%200%209-5%2014-14%2015z%22/%3E%3Cpath%20d%3D%22M50%2035h-5M50%2041h-5%22/%3E%3C/svg%3E"><link href="https://fonts.googleapis.com/css2?family=Vollkorn:wght@600&family=Hanken+Grotesk:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>:root {
  --color-paper: oklch(95.8% 0.024 90); --color-paper-2: oklch(92.6% 0.030 90); --color-paper-3: oklch(89% 0.034 90);
  --color-ink: oklch(23% 0.050 152); --color-ink-2: oklch(33% 0.048 150); --color-muted: oklch(46% 0.034 142);
  --color-rule: oklch(83% 0.024 112); --color-rule-2: oklch(68% 0.042 138);
  --color-accent: oklch(46% 0.135 142); --color-accent-2: oklch(86% 0.075 128); --color-accent-ink: oklch(97% 0.015 95);
  --color-focus: oklch(46% 0.135 142); --tint-moss: oklch(46% 0.135 142 / 0.11); --tint-clay: oklch(54% 0.140 46 / 0.10);
  --font-display: "Vollkorn", ui-serif, Georgia, serif; --font-body: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-outlier: "Newsreader", ui-serif, Georgia, serif;
  --radius-card: 4px; --radius-pill: 999px; --rule-hair: 1px; --shadow-card: none;
  --tracking-display: -0.012em; --display-weight: 600;
}
*{box-sizing:border-box}body{margin:0;background:var(--color-paper);color:var(--color-ink);font:400 1rem/1.55 var(--font-body)}
.w{max-width:60rem;margin:0 auto;padding:1.5rem 16px 3rem}h1{font:600 clamp(1.7rem,4vw,2.4rem)/1.1 var(--font-display);letter-spacing:var(--tracking-display);margin:.2rem 0 .4rem}
.k{color:var(--color-muted);font-size:.9rem;margin:0}#m{height:min(62vh,520px);margin:1.2rem 0;border:1px solid var(--color-rule-2)}
table{width:100%;border-collapse:collapse}td{padding:.6rem 0;border-bottom:1px solid var(--color-rule);vertical-align:top}td:last-child{text-align:right;white-space:nowrap;font-weight:600}
.tot td{font:600 1.3rem/1.2 var(--font-display);border-bottom:0;padding-top:1rem}.sw{display:inline-block;width:.8rem;height:.8rem;margin-right:.45rem;vertical-align:-.05rem;border:1px solid #fff;outline:1px solid var(--color-rule-2)}
.note{color:var(--color-muted);font-size:.9rem}.bad{padding:2rem 0}
.job{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:1px;background:var(--color-rule);border:1px solid var(--color-rule);margin:1.2rem 0 0}
.job div{background:var(--color-paper);padding:.7rem .85rem}.job span{display:block;color:var(--color-muted);font-size:.8rem}.job b{font:600 1.05rem/1.3 var(--font-display)}
.acts{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0 0}.acts a,.acts button{font:600 .95rem/1 var(--font-body);padding:.7rem 1rem;border:1px solid var(--color-ink);background:var(--color-paper);color:var(--color-ink);text-decoration:none;cursor:pointer}
.acts a:first-child{background:var(--color-ink);color:var(--color-paper)}@media print{.acts{display:none}#m{height:420px}}</style></head><body><div class="w">
<p class="k">Crewcut Lawn &amp; Garden · quote from your website</p><h1 id="a">Quote check</h1><p class="k" id="sub"></p>
<div class="job" id="job" hidden></div>
<div id="m" role="region" aria-label="Aerial photo with the measured areas"></div>
<table id="t"></table><p class="note" id="n"></p><div class="acts" id="acts" hidden></div></div>
<script>addEventListener('DOMContentLoaded',()=>{
 const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const dec5=s=>{let i=0,la=0,ln=0;const o=[];while(i<s.length){for(let k=0;k<2;k++){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);const d=(r&1)?~(r>>1):(r>>1);if(k)ln+=d;else la+=d;}o.push([la/1e5,ln/1e5]);}return o;};
 let d;try{const b=atob(location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/'));d=JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))));}
 catch(e){document.querySelector('.w').innerHTML='<p class="bad">This quote link is incomplete. Ask the customer to send it again.</p>';return;}
 $('a').textContent=d.a||'Quote check';$('sub').textContent='About $'+d.r[0]+'–$'+d.r[1]+(d.s.length?' · '+d.s.length+' area'+(d.s.length>1?'s':'')+' measured':'');
 const map=L.map('m',{maxZoom:21,scrollWheelZoom:false});
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:20,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'}).addTo(map);
 const g=L.featureGroup().addTo(map);
 (d.k||[]).forEach(([lab,m,pl])=>L.polyline(dec5(pl),{color:'#ff3b3b',weight:5}).bindTooltip(esc(lab)+': '+m+' m').addTo(g));
 d.s.forEach(([lab,col,m2,pl,est])=>L.polygon(dec5(pl),{color:'#fff',weight:2,dashArray:est?'6 5':null,fillColor:col,fillOpacity:.45}).bindTooltip(esc(lab)+': '+m2+' m²').addTo(g));
 const x=d.x||null;if(x&&x.sec)L.polygon(dec5(x.sec),{color:'#ff4fd8',weight:2,dashArray:'5 5',fill:false,interactive:false}).addTo(map);
 if(d.h)L.circleMarker(d.h,{radius:6,color:'#fff',weight:2,fillColor:'#111',fillOpacity:1}).addTo(g);
 if(x){const f=n=>Number(n).toLocaleString('en-NZ'),c=[];
  c.push(['Goes to',esc(x.c)+(x.cn?'<br><small>'+esc(x.cn)+'</small>':'')]);
  if(x.m!=null||x.km!=null)c.push(['Drive from base',(x.m!=null?x.m+' min':'')+(x.km!=null?(x.m!=null?' · ':'')+x.km+' km':'')]);
  if(x.land)c.push(['Section',f(x.land)+' m²']);if(x.house)c.push(['House',f(x.house)+' m²']);
  c.push(['Customer','Name and mobile come with it']);c.push(['Cross-lease',x.cl?'Yes, '+x.cl+' homes':'No']);
  if(x.ts)c.push(['Asked',new Date(x.ts).toLocaleString('en-NZ',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})]);
  $('job').innerHTML=c.map(([k,v])=>'<div><span>'+k+'</span><b>'+v+'</b></div>').join('');$('job').hidden=false;}
 if(d.h){$('acts').innerHTML='<a href="https://www.google.com/maps/dir/?api=1&destination='+d.h[0]+','+d.h[1]+'" target="_blank" rel="noopener">Directions</a><button type="button" onclick="print()">Print job sheet</button>';$('acts').hidden=false;}
 const fit=()=>{map.invalidateSize();if(g.getLayers().length>1||d.s.length){map.fitBounds(g.getBounds(),{padding:[24,24],maxZoom:20});if(map.getZoom()<19)map.setZoom(19);}else if(d.h)map.setView(d.h,19);else map.setView([-41,174],5);};
 fit();addEventListener('load',fit);
 let h=d.l.map(([t,de,p])=>'<tr><td><b>'+esc(t)+'</b> '+esc(de)+'</td><td>'+esc(p)+'</td></tr>').join('');
 const by={};d.s.forEach(([lab,col,m2])=>{by[lab]=by[lab]||{col,m2:0,n:0};by[lab].m2+=m2;by[lab].n++;});
 h+=Object.entries(by).map(([lab,v])=>'<tr><td><span class="sw" style="background:'+esc(v.col)+'"></span>'+esc(lab)+(v.n>1?' ('+v.n+' areas)':'')+'</td><td>'+v.m2+' m²</td></tr>').join('');
 h+=(d.k||[]).map(([lab,m])=>'<tr><td><span class="sw" style="background:#ff3b3b"></span>'+esc(lab)+' (measured on the photo)</td><td>'+m+' m</td></tr>').join('');
 if(d.t)h+='<tr><td colspan="2">'+esc(d.t)+'</td></tr>';
 h+='<tr class="tot"><td>Estimate</td><td>$'+d.r[0]+'–$'+d.r[1]+'</td></tr>';$('t').innerHTML=h;
 const notes=[];if(d.s.some(x=>x[4]))notes.push('Dashed areas run under trees or a roof, so they were estimated.');
 if(d.p&&d.p.d)notes.push('Photo taken '+new Date(d.p.d).toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})+'.'+(d.p.alt?' A second photo from '+esc(d.p.alt)+' was also used because of shade.':''));
 if(d.p&&d.p.nh)notes.push('Warning: the photo is older than the house ('+d.p.nh+' m² of building isn’t in it), so check the lawn on site.');
 if(d.j)notes.push('The customer '+esc(d.j.replace(/^I adjusted the drawing: /,'adjusted the drawing: ').replace(/I adjusted it/g,'they adjusted it'))+' (the price allows up to the owner’s limit).');
 $('n').innerHTML=notes.join('<br>');
});</script></body></html>
